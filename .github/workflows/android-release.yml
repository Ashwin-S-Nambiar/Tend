name: Android release

# Pushing a tag like v1.2.0 builds a signed APK and attaches it to that GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TEND_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "TEND_KEYSTORE_BASE64 is not set; refusing to publish an unsigned build." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tend.jks"
          echo "TEND_KEYSTORE=$RUNNER_TEMP/tend.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          TEND_KEYSTORE_PASSWORD: ${{ secrets.TEND_KEYSTORE_PASSWORD }}
          TEND_KEY_ALIAS: ${{ secrets.TEND_KEY_ALIAS }}
          TEND_KEY_PASSWORD: ${{ secrets.TEND_KEY_PASSWORD }}
        run: |
          export TEND_VERSION_NAME="${GITHUB_REF_NAME#v}"
          export TEND_VERSION_CODE="${GITHUB_RUN_NUMBER}"
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "tend-${TEND_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk tend.apk

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Tend $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" tend-*.apk tend.apk --clobber

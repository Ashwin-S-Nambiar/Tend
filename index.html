<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#faf7f3" />
    <meta name="color-scheme" content="light dark" />
    <title>Tend · Your medicines, on time</title>
    <meta name="description" content="A gentle medicine reminder. Tell Tend when your day happens and what you take, and Pip reminds you at each routine. Everything stays on your phone." />
    <link rel="canonical" href="https://tend.ashwin.co.in/" />
    <meta property="og:site_name" content="Tend" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tend · Your medicines, on time" />
    <meta property="og:description" content="A gentle medicine reminder that follows your routines. Everything stays on your phone." />
    <meta property="og:url" content="https://tend.ashwin.co.in/" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (() => {
        try {
          const t = JSON.parse(localStorage.getItem('tend:theme') || '"system"');
          const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.setAttribute('data-dark', '');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1528');
          }
        } catch {}
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #faf7f3; }
      html[data-dark], html[data-dark] body { background: #0e1528; }
      #root { opacity: 0.01; transition: opacity 240ms cubic-bezier(0.23, 1, 0.32, 1); }
      html.ready #root { opacity: 1; }
      @media (prefers-reduced-motion: reduce) { #root { transition: none; } }
    </style>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Tend" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" href="/fonts/gabarito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/rethink-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <noscript>Tend needs JavaScript to keep your medicines on time.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

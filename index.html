    <script>
      (() => {
        if (matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone === true)
          document.documentElement.classList.add('standalone');
        try {
          const t = JSON.parse(localStorage.getItem('tend:theme') || '"system"');
          const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          if (dark) {
            document.documentElement.setAttribute('data-dark', '');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1528');
          }
        } catch {}
      })();
    </script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #faf7f3; }
      html[data-dark], html[data-dark] body { background: #0e1528; }
      #root { opacity: 0.01; transition: opacity 240ms cubic-bezier(0.23, 1, 0.32, 1); }
      html.ready #root { opacity: 1; }
      @media (prefers-reduced-motion: reduce) { #root { transition: none; } }
      #splash { display: none; }
      html.standalone #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #faf7f3; transition: opacity 280ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      html.standalone[data-dark] #splash { background: #0e1528; }
      html.standalone.splashed #splash { opacity: 0; pointer-events: none; }
      #splash svg { width: 112px; height: 112px; overflow: visible; }
      #splash .body { transform-box: fill-box; transform-origin: 50% 100%; animation: splash-hop 1100ms cubic-bezier(0.23, 1, 0.32, 1) 120ms both; }
      #splash .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: splash-blink 1100ms linear 120ms both; }
      #splash .open { opacity: 0; animation: splash-eyes 1100ms linear 120ms both; }
      #splash .happy { animation: splash-happy 1100ms linear 120ms both; }
      html[data-dark] #splash .pip { fill: #2cc1aa; }
      html[data-dark] #splash .seam { fill: #2cc1aa; opacity: 0.55; }
      html[data-dark] #splash .eye { stroke: #0b1a2e; }
      @keyframes splash-hop {
        0%, 10% { transform: none; }
        24% { transform: scale(1.08, 0.9); }
        44% { transform: translateY(-18px) scale(0.95, 1.06); }
        62% { transform: scale(1.05, 0.95); }
        78%, 100% { transform: none; }
      }
      @keyframes splash-eyes { 0%, 52% { opacity: 1; } 58%, 100% { opacity: 0; } }
      @keyframes splash-happy { 0%, 52% { opacity: 0; } 58%, 100% { opacity: 1; } }
      @keyframes splash-blink { 0%, 30% { transform: none; } 34% { transform: scaleY(0.1); } 38%, 100% { transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #splash .body, #splash .eyes, #splash .open, #splash .happy { animation: none; }
        #splash .open { opacity: 0; }
      }
    </style>
